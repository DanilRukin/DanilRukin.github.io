baseURL: "http://localhost:1313/"
title: "Данил Рукин - C#/.NET Developer"
pagination:
  pagerSize: 5
theme: "papermod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

enableInlineShortcodes: true
enableEmoji: true
pygmentsUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: home
      name: Главная
      url: /
      weight: 1
    - identifier: blog
      name: Статьи
      url: /blog/
      weight: 2
    - identifier: projects
      name: Проекты
      url: /projects/
      weight: 3
    - identifier: experiments
      name: Интерактивные демо проектов
      url: /experiments/
      weight: 4
    - identifier: resume
      name: Резюме
      url: /resume/
      weight: 5
    - identifier: github
      name: GitHub
      url: https://github.com/DanilRukin
      weight: 6

params:
  env: production
  title: Danil Rukin
  description: "C# разработчик, архитектор, TeamLead. Портфолио со статьями об архитектурах, подходах, управлении командой и демо моих проектов"
  keywords: ["C#", ".NET", "DDD", "ERP", "CleanArchitecture", "Портфолио"]

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  comments:
    enabled: true
    provider: "utterances"
    utterances:
      repo: "DanilRukin/DanilRukin.github.io"
      issueTerm: "pathname"
      theme: "github-light"

  socialIcons:
    - name: "github"
      url: "https://github.com/DanilRukin"
    - name: "linkedin"
      url: "https://linkedin.com/in/danilrukin"
    - name: "telegram"
      url: "https://t.me/dvrukin"
    - name: "email"
      url: "rukin2018d@gmail.com"

outputs:
  home:
    - HTML
    - RSS
    - JSON
